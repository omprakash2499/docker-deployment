services:
  api:
    build: .
    image: incident-api:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_VERSION: local
    volumes:
      - incident-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  incident-data:
